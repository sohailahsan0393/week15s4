name: wf-ci-development

on:
  pull_request:
    branches:
      - develop

jobs:
  ci-development-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Lint HTML and CSS files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Test build
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
